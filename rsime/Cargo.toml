[package]
name = "rsime"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = []
cli = ["clap", "clap_complete", "crossterm", "ratatui", "ureq"]
# 转发到 rime-sys/bundled-vcpkg，自动编译 librime。
# 需预装 vcpkg 并设置 VCPKG_ROOT，详见 rime-sys/Cargo.toml。
bundled-vcpkg = ["rime-sys/bundled-vcpkg"]

[dependencies]
anyhow = "1.0.100"
rime-sys = { path = "../rime-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI dependencies
clap = { version = "4.5.53", features = ["derive"], optional = true }
clap_complete = { version = "4", features = ["unstable-dynamic"], optional = true }
crossterm = { version = "0.29", features = ["use-dev-tty"], optional = true }
libc = "0.2"
ratatui = { version = "0.30", optional = true }
ureq = { version = "3", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bin]]
name = "rsime"
path = "src/main.rs"
required-features = ["cli"]
