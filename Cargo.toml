[package]
name = "rsime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
clap_complete = "4"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
libc = "0.2"
ratatui = "0.30"
librime-sys = { path = "./librime-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
serde_json = "1"
