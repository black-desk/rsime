[package]
name = "rsime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
clap_complete = "4"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
libc = "0.2"
ratatui = "0.30"
rime-api = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[patch.crates-io]
librime-sys = { path = "./third_party/librime-rs/librime-sys" }
rime-api = { path = "./third_party/librime-rs" }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
serde_json = "1"
