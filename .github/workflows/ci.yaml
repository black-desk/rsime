name: Continuous Integration
on:
  push:
    branches:
      - main
      - master
      - release/*
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight UTC

jobs:
  generic:
    runs-on: ubuntu-latest
    steps:
      - uses: black-desk/workflows/generic@master
        env:
          CLEAN_IGNORE: rime-sys/vcpkg-overlay/**/*.patch

  autotools:
    name: cargo test (vcpkg bundled librime)
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Pre-download lua for vcpkg
        run: |
          mkdir -p /usr/local/share/vcpkg/downloads
          wget -O /usr/local/share/vcpkg/downloads/lua-5.4.8.tar.gz https://ftp2.osuosl.org/pub/blfs/conglomeration/lua/lua-5.4.8.tar.gz

      - name: Build and test with coverage (bundled-vcpkg)
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg

      - uses: black-desk/workflows/codecov@master

  rust:
    name: rust (system librime)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - run: |
          sudo apt update
          sudo apt install -y librime-dev
      - uses: black-desk/workflows/rust@master

  macos:
    name: rust (macOS system librime)
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - run: brew install librime pkg-config
      - uses: black-desk/workflows/rust@master

  pass:
    name: pass
    if: always()
    needs:
      - generic
      - autotools
      - rust
      - macos
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
