name: Continuous Integration
on:
  push:
    branches:
      - main
      - master
      - release/*
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  generic:
    runs-on: ubuntu-latest
    steps:
      - uses: black-desk/workflows/generic@master
        env:
          CLEAN_IGNORE: rime-sys/vcpkg-overlay/**/*.patch

  autotools:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        librime:
          - system
          - bundled-vcpkg
    name: ${{ matrix.os }} (${{ matrix.librime }})
    permissions:
      id-token: write
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system librime
        if: matrix.librime == 'system'
        run: |
          case "${{ runner.os }}" in
            Linux)
              sudo apt update
              sudo apt install -y librime-dev
              ;;
            macOS)
              brew update
              brew install librime pkg-config
              ;;
            *)
              echo "Unsupported runner OS: ${{ runner.os }}" >&2
              exit 1
              ;;
          esac

      - uses: black-desk/workflows/autotools@master
        env:
          VCPKG_ROOT: ${{ matrix.librime == 'bundled-vcpkg' && '/usr/local/share/vcpkg' || '' }}

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - run: |
          sudo apt update
          sudo apt install -y librime-dev
      - uses: black-desk/workflows/rust@master
        with:
          cargo-flags: ''

  pass:
    name: pass
    if: always()
    needs:
      - generic
      - autotools
      - rust
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
