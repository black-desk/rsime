name: Continuous Integration
on:
  push:
    branches:
      - main
      - master
      - release/*
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight UTC

jobs:
  generic:
    runs-on: ubuntu-latest
    steps:
      - uses: black-desk/workflows/generic@master
        env:
          CLEAN_IGNORE: rime-sys/vcpkg-overlay/**/*.patch

  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux (system librime)
            os: ubuntu-latest
            setup: sudo apt update && sudo apt install -y librime-dev
            cargo-flags: --workspace
          - name: linux (bundled-vcpkg)
            os: ubuntu-latest
            setup: ""
            cargo-flags: --all-features --workspace
            vcpkg-root: /usr/local/share/vcpkg
          - name: macos (system librime)
            os: macos-latest
            setup: brew install librime pkg-config
            cargo-flags: --workspace
          - name: macos (bundled-vcpkg)
            os: macos-latest
            setup: ""
            cargo-flags: --all-features --workspace
            vcpkg-root: /usr/local/share/vcpkg
    permissions:
      id-token: write
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system librime
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Build and test with coverage
        run: cargo llvm-cov ${{ matrix.cargo-flags }} --lcov --output-path lcov.info
        env:
          VCPKG_ROOT: ${{ matrix.vcpkg-root }}

      - uses: black-desk/workflows/codecov@master

  pass:
    name: pass
    if: always()
    needs:
      - generic
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
