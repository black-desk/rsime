[package]
name = "rime-sys"
version = "0.1.0"
links = "rime"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
# 启用后 build.rs 自动调用 vcpkg 编译 librime。
# 用户需预装 vcpkg（https://vcpkg.io/en/getting-started.html），
# 并设置 VCPKG_ROOT 环境变量或将 vcpkg 放入 PATH。
bundled-vcpkg = []

[build-dependencies]
# FIXME:
# bindgen 0.73's default features are ["logging", "prettyplease", "runtime"].
# We explicitly turn off "prettyplease":
# bindgen 0.73.2 depends on syn ">=2, <4", so cargo unifies it with the
# syn 3 already required elsewhere in the graph (serde_derive/clap_derive).
# prettyplease, however, stays on 0.2.x (pinned by wit-bindgen) and is built
# against syn 2; the mismatched types make bindgen fail to compile (E0277)
# whenever its "prettyplease" feature is enabled.
# This project never opts into Formatter::Prettyplease (bindgen's default
# formatter is rustfmt), so the feature is simply disabled to avoid the issue.
# Default features can be restored once upstream fixes syn 3 compatibility.
bindgen = { version = "0.73", default-features = false, features = [
    "logging",
    "runtime",
] }
pkg-config = "0.3"
